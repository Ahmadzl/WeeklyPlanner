        /* =========================================================
           MOBILE SELECTION HELPERS
           ========================================================= */

        function clearMobileSelection() {

            mobileSelection = null;

            document
                .querySelectorAll(
                    ".mobile-selected"
                )
                .forEach(element => {

                    element.classList.remove(
                        "mobile-selected"
                    );

                });


            document
                .querySelectorAll(
                    ".mobile-target"
                )
                .forEach(element => {

                    element.classList.remove(
                        "mobile-target"
                    );

                });

        }


        function selectMobileCompany(
            companyName,
            element
        ) {

            clearMobileSelection();


            mobileSelection = {
                source: "sidebar",
                company: companyName
            };


            if (element) {

                element.classList.add(
                    "mobile-selected"
                );

            }


            showStatus(
                "Company selected. Tap a day and time."
            );

        }


        function selectMobileExisting(
            key,
            index,
            element
        ) {

            clearMobileSelection();


            mobileSelection = {
                source: "existing",
                key: key,
                index: index
            };


            if (element) {

                element.classList.add(
                    "mobile-selected"
                );

            }


            showStatus(
                "Company selected. Tap a new day and time."
            );

        }


        /* =========================================================
           CHECK COMPANY IN DAY
           ========================================================= */

        function companyExistsOnDay(
            companyName,
            day,
            ignoreKey = null,
            ignoreIndex = null
        ) {

            const dayPrefix =
                day + "_";


            for (
                const key of Object.keys(schedule)
            ) {

                if (
                    !key.startsWith(dayPrefix)
                ) {
                    continue;
                }


                if (!schedule[key]) {
                    continue;
                }


                for (
                    let index = 0;
                    index < schedule[key].length;
                    index++
                ) {

                    if (
                        key === ignoreKey &&
                        index === ignoreIndex
                    ) {
                        continue;
                    }


                    if (
                        schedule[key][index] ===
                        companyName
                    ) {

                        return true;

                    }

                }

            }


            return false;

        }


        /* =========================================================
           GET DAY FROM KEY
           ========================================================= */

        function getDayFromKey(key) {

            const separator =
                key.lastIndexOf("_");


            return key.substring(
                0,
                separator
            );

        }


        /* =========================================================
           HANDLE MOBILE PLACEMENT
           ========================================================= */

        function handleMobilePlacement(
            day,
            time
        ) {

            if (!mobileSelection) {

                showStatus(
                    "Select a company first."
                );

                return;

            }


            const key =
                createKey(
                    day,
                    time
                );


            /* =====================================================
               MOVE EXISTING COMPANY
               ===================================================== */

            if (
                mobileSelection.source ===
                "existing"
            ) {

                const oldKey =
                    mobileSelection.key;

                const oldIndex =
                    mobileSelection.index;


                if (!schedule[oldKey]) {

                    clearMobileSelection();

                    return;

                }


                const company =
                    schedule[oldKey][oldIndex];


                if (company === undefined) {

                    clearMobileSelection();

                    return;

                }


                /* Clicking the same position */

                if (
                    oldKey === key
                ) {

                    clearMobileSelection();

                    showStatus(
                        "Company is already here."
                    );

                    renderSchedule();

                    return;

                }


                /*
                 * Do not allow the same company twice
                 * on the target day.
                 */
                if (
                    companyExistsOnDay(
                        company,
                        day,
                        oldKey,
                        oldIndex
                    )
                ) {

                    clearMobileSelection();

                    showStatus(
                        company +
                        " is already scheduled for " +
                        day +
                        "."
                    );

                    renderSchedule();

                    return;

                }


                schedule[oldKey].splice(
                    oldIndex,
                    1
                );


                if (
                    schedule[oldKey].length === 0
                ) {

                    delete schedule[oldKey];

                }


                if (!schedule[key]) {

                    schedule[key] = [];

                }


                schedule[key].push(
                    company
                );


                clearMobileSelection();

                markAsChanged();

                renderSchedule();

                return;

            }


            /* =====================================================
               ADD SINGLE COMPANY
               ===================================================== */

            if (
                mobileSelection.source ===
                "sidebar"
            ) {

                const company =
                    mobileSelection.company;


                if (
                    companyExistsOnDay(
                        company,
                        day
                    )
                ) {

                    clearMobileSelection();

                    showStatus(
                        company +
                        " is already scheduled for " +
                        day +
                        "."
                    );

                    return;

                }


                if (!schedule[key]) {

                    schedule[key] = [];

                }


                schedule[key].push(
                    company
                );


                clearMobileSelection();

                markAsChanged();

                renderSchedule();

                return;

            }


            /* =====================================================
               ADD GROUP
               ===================================================== */

            if (
                mobileSelection.source ===
                "group"
            ) {

                const groupCompanies =
                    mobileSelection.companies || [];


                if (
                    groupCompanies.length === 0
                ) {

                    clearMobileSelection();

                    showStatus(
                        "This group has no companies."
                    );

                    return;

                }


                if (!schedule[key]) {

                    schedule[key] = [];

                }


                let addedCount = 0;

                let skippedCount = 0;


                groupCompanies.forEach(
                    company => {

                        if (
                            companyExistsOnDay(
                                company,
                                day
                            )
                        ) {

                            skippedCount++;

                            return;

                        }


                        schedule[key].push(
                            company
                        );

                        addedCount++;

                    }
                );


                clearMobileSelection();


                if (addedCount > 0) {

                    markAsChanged();

                    renderSchedule();

                }


                if (
                    addedCount === 0 &&
                    skippedCount > 0
                ) {

                    showStatus(
                        "All companies in this group are already scheduled for " +
                        day +
                        "."
                    );

                }
                else if (
                    skippedCount > 0
                ) {

                    showStatus(
                        addedCount +
                        " company/companies added. " +
                        skippedCount +
                        " already existed on " +
                        day +
                        "."
                    );

                }


                return;

            }


            clearMobileSelection();

        }


        /* =========================================================
           LOAD COMPANIES
           ========================================================= */

        async function loadCompanies() {

            try {

                const {
                    data,
                    error
                } = await supabaseClient
                    .from("companies")
                    .select(
                        "id, name, group_id, is_group"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


                if (error) {

                    console.error(
                        "Company load error:",
                        error
                    );

                    showStatus(
                        "Could not load companies."
                    );

                    companies = [];

                    createCompanyList();

                    return;
                }


                companies = data || [];

                createCompanyList();

            }
            catch (error) {

                console.error(error);

                companies = [];

                createCompanyList();

                showStatus(
                    "An error occurred while loading companies."
                );

            }

        }


        /* =========================================================
           COMPANY LIST
           ========================================================= */

        function createCompanyList() {

            const container =
                document.getElementById(
                    "companyList"
                );

            container.innerHTML = "";


            const groups =
                companies.filter(
                    item => item.is_group
                );


            const standalone =
                companies.filter(
                    item =>
                        !item.is_group &&
                        !item.group_id
                );


            /* GROUPS */

            groups.forEach(groupItem => {

                const group =
                    document.createElement("div");

                group.className =
                    "company-group";


                const header =
                    document.createElement("div");

                header.className =
                    "company-group-header";

                header.textContent =
                    "▶ " + groupItem.name;

                header.draggable = true;


                const childrenContainer =
                    document.createElement("div");

                childrenContainer.className =
                    "company-group-children";

                childrenContainer.style.display =
                    "none";


                /* Group drag - desktop */

                header.addEventListener(
                    "dragstart",
                    function () {

                        const children =
                            companies
                                .filter(
                                    item =>
                                        !item.is_group &&
                                        item.group_id === groupItem.id
                                )
                                .map(
                                    item => item.name
                                );


                        draggedData = {
                            source: "group",
                            companies: children
                        };

                    }
                );


                /* Open / close */

                header.addEventListener(
                    "click",
                    function () {

                        const hidden =
                            childrenContainer.style.display ===
                            "none";


                        childrenContainer.style.display =
                            hidden ? "flex" : "none";


                        header.textContent =
                            (hidden ? "▼ " : "▶ ")
                            + groupItem.name;

                    }
                );


                /* Children */

                companies
                    .filter(
                        item =>
                            !item.is_group &&
                            item.group_id === groupItem.id
                    )
                    .forEach(child => {

                        const childCard =
                            document.createElement("div");

                        childCard.className =
                            "company-card";

                        childCard.textContent =
                            child.name;

                        childCard.draggable = true;


                        /* Desktop drag */

                        childCard.addEventListener(
                            "dragstart",
                            function () {

                                draggedData = {
                                    source: "sidebar",
                                    company: child.name
                                };

                            }
                        );


                        /* Mobile tap */

                        childCard.addEventListener(
                            "click",
                            function (event) {

                                /*
                                 * Ignore click caused by
                                 * dragging on desktop.
                                 */
                                if (
                                    window.innerWidth <= 700
                                ) {

                                    event.preventDefault();

                                    selectMobileCompany(
                                        child.name,
                                        childCard
                                    );

                                }

                            }
                        );


                        childrenContainer.appendChild(
                            childCard
                        );

                    });


                group.appendChild(header);

                group.appendChild(
                    childrenContainer
                );

                container.appendChild(group);

            });


            /* STANDALONE COMPANIES */

            standalone.forEach(company => {

                const card =
                    document.createElement("div");

                card.className =
                    "company-card";

                card.textContent =
                    company.name;

                card.draggable = true;


                /* Desktop drag */

                card.addEventListener(
                    "dragstart",
                    function () {

                        draggedData = {
                            source: "sidebar",
                            company: company.name
                        };

                    }
                );


                /* Mobile tap */

                card.addEventListener(
                    "click",
                    function (event) {

                        if (
                            window.innerWidth <= 700
                        ) {

                            event.preventDefault();

                            selectMobileCompany(
                                company.name,
                                card
                            );

                        }

                    }
                );


                container.appendChild(card);

            });


            if (
                groups.length === 0 &&
                standalone.length === 0
            ) {

                const empty =
                    document.createElement("div");

                empty.style.color =
                    "#777";

                empty.style.fontSize =
                    "12px";

                empty.style.textAlign =
                    "center";

                empty.style.padding =
                    "20px 5px";

                empty.textContent =
                    "No companies added yet.";

                container.appendChild(empty);

            }

        }


        /* =========================================================
           CREATE PLANNER
           ========================================================= */

        function createPlanner() {

            const grid =
                document.getElementById(
                    "plannerGrid"
                );

            grid.innerHTML = "";


            /* Time header */

            const emptyHeader =
                document.createElement("div");

            emptyHeader.className =
                "grid-header";

            emptyHeader.textContent =
                "Time";

            grid.appendChild(emptyHeader);


            /* Days */

            days.forEach(day => {

                const header =
                    document.createElement("div");

                header.className =
                    "grid-header";

                header.textContent =
                    day;

                grid.appendChild(header);

            });


            /* Time rows */

            times.forEach(time => {

                const timeCell =
                    document.createElement("div");

                timeCell.className =
                    "time-cell";

                timeCell.textContent =
                    time;

                grid.appendChild(timeCell);


                days.forEach(day => {

                    const zone =
                        document.createElement("div");

                    zone.className =
                        "drop-zone";

                    zone.dataset.day =
                        day;

                    zone.dataset.time =
                        time;


                    /* Desktop drag over */

                    zone.addEventListener(
                        "dragover",
                        function (event) {

                            event.preventDefault();

                            zone.classList.add(
                                "drag-over"
                            );

                        }
                    );


                    zone.addEventListener(
                        "dragleave",
                        function () {

                            zone.classList.remove(
                                "drag-over"
                            );

                        }
                    );


                    /* Desktop drop */

                    zone.addEventListener(
                        "drop",
                        function (event) {

                            event.preventDefault();

                            zone.classList.remove(
                                "drag-over"
                            );

                            handleDrop(
                                day,
                                time
                            );

                        }
                    );


                    /* Mobile tap */

                    zone.addEventListener(
                        "click",
                        function () {

                            if (
                                window.innerWidth <= 700
                            ) {

                                handleMobilePlacement(
                                    day,
                                    time
                                );

                            }

                        }
                    );


                    grid.appendChild(zone);

                });

            });


            renderSchedule();

        }


        /* =========================================================
           HANDLE DROP - DESKTOP
           ========================================================= */

        function handleDrop(day, time) {

            const key =
                createKey(
                    day,
                    time
                );


            /* MOVE EXISTING */

            if (draggedExisting) {

                const oldKey =
                    draggedExisting.key;

                const oldIndex =
                    draggedExisting.index;


                if (!schedule[oldKey]) {

                    draggedExisting = null;

                    return;
                }


                const company =
                    schedule[oldKey][oldIndex];


                if (company === undefined) {

                    draggedExisting = null;

                    return;
                }


                /*
                 * If moving to another day, make sure
                 * the company does not already exist there.
                 */
                const oldDay =
                    getDayFromKey(oldKey);


                if (
                    oldDay !== day &&
                    companyExistsOnDay(
                        company,
                        day,
                        oldKey,
                        oldIndex
                    )
                ) {

                    draggedExisting = null;

                    showStatus(
                        company +
                        " is already scheduled for " +
                        day +
                        "."
                    );

                    return;

                }


                /* Same position */

                if (
                    oldKey === key
                ) {

                    draggedExisting = null;

                    return;

                }


                schedule[oldKey].splice(
                    oldIndex,
                    1
                );


                if (
                    schedule[oldKey].length === 0
                ) {

                    delete schedule[oldKey];

                }


                if (!schedule[key]) {

                    schedule[key] = [];

                }


                schedule[key].push(
                    company
                );


                draggedExisting = null;

                markAsChanged();

                renderSchedule();

                return;
            }


            /* NOTHING DRAGGED */

            if (!draggedData) {
                return;
            }


            /* GROUP */

            if (
                draggedData.source ===
                "group"
            ) {

                if (
                    draggedData.companies.length === 0
                ) {

                    draggedData = null;

                    showStatus(
                        "This group has no companies."
                    );

                    return;
                }


                if (!schedule[key]) {

                    schedule[key] = [];

                }


                let addedCount = 0;

                let skippedCount = 0;


                draggedData.companies.forEach(
                    company => {

                        /*
                         * Do not add the same company
                         * twice on the same day.
                         */
                        if (
                            companyExistsOnDay(
                                company,
                                day
                            )
                        ) {

                            skippedCount++;

                            return;

                        }


                        schedule[key].push(
                            company
                        );

                        addedCount++;

                    }
                );


                draggedData = null;


                if (addedCount > 0) {

                    markAsChanged();

                    renderSchedule();

                }


                if (
                    addedCount === 0 &&
                    skippedCount > 0
                ) {

                    showStatus(
                        "All companies in this group are already scheduled for " +
                        day +
                        "."
                    );

                }
                else if (
                    skippedCount > 0
                ) {

                    showStatus(
                        addedCount +
                        " company/companies added. " +
                        skippedCount +
                        " already existed on " +
                        day +
                        "."
                    );

                }


                return;
            }


            /* SINGLE COMPANY */

            if (
                draggedData.source ===
                "sidebar"
            ) {

                const company =
                    draggedData.company;


                /*
                 * Do not allow same company twice
                 * on the same day.
                 */
                if (
                    companyExistsOnDay(
                        company,
                        day
                    )
                ) {

                    draggedData = null;

                    showStatus(
                        company +
                        " is already scheduled for " +
                        day +
                        "."
                    );

                    return;

                }


                if (!schedule[key]) {

                    schedule[key] = [];

                }


                schedule[key].push(
                    company
                );


                draggedData = null;

                markAsChanged();

                renderSchedule();

                return;
            }


            draggedData = null;

        }


        /* =========================================================
           CREATE KEY
           ========================================================= */

        function createKey(day, time) {

            return day + "_" + time;

        }


        /* =========================================================
           RENDER SCHEDULE
           ========================================================= */

        function renderSchedule() {

            document
                .querySelectorAll(".drop-zone")
                .forEach(zone => {

                    zone.innerHTML = "";


                    const day =
                        zone.dataset.day;

                    const time =
                        zone.dataset.time;


                    const key =
                        createKey(
                            day,
                            time
                        );


                    if (!schedule[key]) {
                        return;
                    }


                    schedule[key].forEach(
                        (company, index) => {

                            const item =
                                document.createElement(
                                    "div"
                                );

                            item.className =
                                "placed-company";

                            item.draggable = true;


                            const name =
                                document.createElement(
                                    "span"
                                );

                            name.textContent =
                                company;


                            const remove =
                                document.createElement(
                                    "button"
                                );

                            remove.className =
                                "remove-btn";

                            remove.textContent =
                                "×";

                            remove.title =
                                "Remove";


                            remove.addEventListener(
                                "mousedown",
                                function (event) {

                                    event.stopPropagation();

                                }
                            );


                            remove.addEventListener(
                                "click",
                                function (event) {

                                    event.stopPropagation();

                                    removeCompany(
                                        key,
                                        index
                                    );

                                }
                            );


                            item.appendChild(name);

                            item.appendChild(remove);


                            /* Desktop drag */

                            item.addEventListener(
                                "dragstart",
                                function () {

                                    draggedExisting = {
                                        key: key,
                                        index: index
                                    };

                                    draggedData = null;

                                }
                            );


                            item.addEventListener(
                                "dragend",
                                function () {

                                    draggedExisting = null;

                                }
                            );


                            /* Mobile tap */

                            item.addEventListener(
                                "click",
                                function (event) {

                                    if (
                                        window.innerWidth <= 700
                                    ) {

                                        event.stopPropagation();

                                        event.preventDefault();

                                        selectMobileExisting(
                                            key,
                                            index,
                                            item
                                        );

                                    }

                                }
                            );


                            zone.appendChild(item);

                        }
                    );

                });

        }


        /* =========================================================
           REMOVE COMPANY FROM PLANNER
           ========================================================= */

        function removeCompany(
            key,
            index
        ) {

            if (!schedule[key]) {
                return;
            }


            schedule[key].splice(
                index,
                1
            );


            if (
                schedule[key].length === 0
            ) {

                delete schedule[key];

            }


            clearMobileSelection();

            markAsChanged();

            renderSchedule();

        }


        /* =========================================================
           MARK AS CHANGED
           ========================================================= */

        function markAsChanged() {

            hasUnsavedChanges = true;

            updateButtons();

        }


        /* =========================================================
           UPDATE BUTTONS
           ========================================================= */

        function updateButtons() {

            const saveButton =
                document.getElementById(
                    "saveButton"
                );

            const discardButton =
                document.getElementById(
                    "discardButton"
                );

            const indicator =
                document.getElementById(
                    "unsavedIndicator"
                );


            saveButton.disabled =
                !hasUnsavedChanges;


            discardButton.disabled =
                !hasUnsavedChanges;


            if (hasUnsavedChanges) {

                indicator.classList.add(
                    "show"
                );

            }
            else {

                indicator.classList.remove(
                    "show"
                );

            }

        }


        /* =========================================================
           LOAD SCHEDULE
           ========================================================= */

        async function loadSchedule() {

            try {

                const {
                    data,
                    error
                } = await supabaseClient
                    .from("weekly_schedule")
                    .select(
                        "id, day, time, company"
                    )
                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    );


                if (error) {

                    console.error(
                        "Supabase load error:",
                        error
                    );

                    showStatus(
                        "Could not load the schedule."
                    );

                    return;
                }


                schedule = {};


                data.forEach(row => {

                    const key =
                        createKey(
                            row.day,
                            row.time
                        );


                    if (!schedule[key]) {

                        schedule[key] = [];

                    }


                    /*
                     * Prevent old duplicate data from
                     * appearing twice on the same day.
                     */
                    if (
                        !companyExistsOnDay(
                            row.company,
                            row.day
                        )
                    ) {

                        schedule[key].push(
                            row.company
                        );

                    }

                });


                savedSchedule =
                    cloneSchedule(
                        schedule
                    );


                hasUnsavedChanges = false;

                updateButtons();

                renderSchedule();

            }
            catch (error) {

                console.error(error);

                showStatus(
                    "An error occurred while loading."
                );

            }

        }


        /* =========================================================
           SAVE CHANGES
           ========================================================= */

        async function saveChanges() {

            if (!hasUnsavedChanges) {
                return;
            }


            const saveButton =
                document.getElementById(
                    "saveButton"
                );


            saveButton.disabled = true;

            saveButton.textContent =
                "Saving...";


            try {

                /* Delete old schedule */

                const {
                    error: deleteError
                } =
                    await supabaseClient
                        .from("weekly_schedule")
                        .delete()
                        .gte("id", 0);


                if (deleteError) {

                    console.error(
                        "Delete error:",
                        deleteError
                    );

                    showStatus(
                        "Could not save the schedule."
                    );

                    return;
                }


                /* Create new rows */

                const rows = [];


                Object.keys(schedule)
                    .forEach(key => {

                        const separator =
                            key.lastIndexOf("_");


                        const day =
                            key.substring(
                                0,
                                separator
                            );


                        const time =
                            key.substring(
                                separator + 1
                            );


                        schedule[key]
                            .forEach(company => {

                                rows.push({
                                    day: day,
                                    time: time,
                                    company: company
                                });

                            });

                    });


                /* Insert new schedule */

                if (rows.length > 0) {

                    const {
                        error: insertError
                    } =
                        await supabaseClient
                            .from(
                                "weekly_schedule"
                            )
                            .insert(rows);


                    if (insertError) {

                        console.error(
                            "Insert error:",
                            insertError
                        );

                        showStatus(
                            "Could not save the schedule."
                        );

                        return;
                    }

                }


                savedSchedule =
                    cloneSchedule(
                        schedule
                    );


                hasUnsavedChanges = false;

                updateButtons();

                showStatus(
                    "Changes saved successfully."
                );

            }
            catch (error) {

                console.error(error);

                showStatus(
                    "An error occurred while saving."
                );

            }
            finally {

                saveButton.textContent =
                    "Save Changes";

                updateButtons();

            }

        }


        /* =========================================================
           DISCARD CHANGES
           ========================================================= */

        function discardChanges() {

            if (!hasUnsavedChanges) {
                return;
            }


            const confirmed =
                confirm(
                    "Discard all unsaved changes?"
                );


            if (!confirmed) {
                return;
            }


            schedule =
                cloneSchedule(
                    savedSchedule
                );


            hasUnsavedChanges = false;

            clearMobileSelection();

            renderSchedule();

            updateButtons();


            showStatus(
                "Unsaved changes discarded."
            );

        }


        /* =========================================================
           RESET
           ========================================================= */

        function resetPlanner() {

            const confirmed =
                confirm(
                    "Reset the weekly planner?\n\nThis will only create an unsaved change. Your saved schedule will not be deleted until you press Save Changes."
                );


            if (!confirmed) {
                return;
            }


            schedule = {};

            clearMobileSelection();

            markAsChanged();

            renderSchedule();


            showStatus(
                "Planner reset. Press Save Changes to apply."
            );

        }


        /* =========================================================
           CLONE SCHEDULE
           ========================================================= */

        function cloneSchedule(source) {

            const copy = {};


            Object.keys(source)
                .forEach(key => {

                    copy[key] =
                        [...source[key]];

                });


            return copy;

        }


        /* =========================================================
           COMPANY MANAGEMENT
           ========================================================= */

        function openCompanyManager() {

            document
                .getElementById(
                    "companyManagerModal"
                )
                .classList.add("show");


            renderManagementList();

        }


        function closeCompanyManager() {

            document
                .getElementById(
                    "companyManagerModal"
                )
                .classList.remove("show");

        }


        /* =========================================================
           RENDER MANAGEMENT LIST
           ========================================================= */

        function renderManagementList() {

            const container =
                document.getElementById(
                    "managementList"
                );

            container.innerHTML = "";


            const groups =
                companies.filter(
                    item => item.is_group
                );


            const standalone =
                companies.filter(
                    item =>
                        !item.is_group &&
                        !item.group_id
                );


            if (
                groups.length === 0 &&
                standalone.length === 0
            ) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "empty-management";

                empty.textContent =
                    "No companies or groups added yet.";

                container.appendChild(empty);

                return;

            }


            /* GROUPS */

            groups.forEach(group => {

                const groupElement =
                    document.createElement("div");

                groupElement.className =
                    "management-group";


                const groupHeader =
                    document.createElement("div");

                groupHeader.className =
                    "management-group-header";


                const groupName =
                    document.createElement("div");

                groupName.className =
                    "management-group-name";

                groupName.textContent =
                    group.name;


                const groupActions =
                    document.createElement("div");

                groupActions.className =
                    "management-actions";


                const editButton =
                    document.createElement("button");

                editButton.className =
                    "edit-company-btn";

                editButton.textContent =
                    "Edit";


                editButton.addEventListener(
                    "click",
                    function () {

                        openGroupForm(group.id);

                    }
                );


                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete-company-btn";

                deleteButton.textContent =
                    "Delete";


                deleteButton.addEventListener(
                    "click",
                    function () {

                        deleteGroup(group);

                    }
                );


                groupActions.appendChild(
                    editButton
                );

                groupActions.appendChild(
                    deleteButton
                );


                groupHeader.appendChild(
                    groupName
                );

                groupHeader.appendChild(
                    groupActions
                );


                groupElement.appendChild(
                    groupHeader
                );


                /* Group children */

                companies
                    .filter(
                        item =>
                            !item.is_group &&
                            item.group_id === group.id
                    )
                    .forEach(company => {

                        const companyElement =
                            document.createElement("div");

                        companyElement.className =
                            "management-company";


                        const companyName =
                            document.createElement("div");

                        companyName.className =
                            "management-company-name";

                        companyName.textContent =
                            company.name;


                        const actions =
                            document.createElement("div");

                        actions.className =
                            "management-actions";


                        const editButton =
                            document.createElement("button");

                        editButton.className =
                            "edit-company-btn";

                        editButton.textContent =
                            "Edit";


                        editButton.addEventListener(
                            "click",
                            function () {

                                openCompanyForm(
                                    company.id
                                );

                            }
                        );


                        const deleteButton =
                            document.createElement("button");

                        deleteButton.className =
                            "delete-company-btn";

                        deleteButton.textContent =
                            "Delete";


                        deleteButton.addEventListener(
                            "click",
                            function () {

                                deleteCompany(
                                    company
                                );

                            }
                        );


                        actions.appendChild(
                            editButton
                        );

                        actions.appendChild(
                            deleteButton
                        );


                        companyElement.appendChild(
                            companyName
                        );

                        companyElement.appendChild(
                            actions
                        );


                        groupElement.appendChild(
                            companyElement
                        );

                    });


                container.appendChild(
                    groupElement
                );

            });


            /* STANDALONE */

            standalone.forEach(company => {

                const element =
                    document.createElement("div");

                element.className =
                    "management-standalone";


                const name =
                    document.createElement("div");

                name.className =
                    "management-company-name";

                name.textContent =
                    company.name;


                const actions =
                    document.createElement("div");

                actions.className =
                    "management-actions";


                const editButton =
                    document.createElement("button");

                editButton.className =
                    "edit-company-btn";

                editButton.textContent =
                    "Edit";


                editButton.addEventListener(
                    "click",
                    function () {

                        openCompanyForm(
                            company.id
                        );

                    }
                );


                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete-company-btn";

                deleteButton.textContent =
                    "Delete";


                deleteButton.addEventListener(
                    "click",
                    function () {

                        deleteCompany(
                            company
                        );

                    }
                );


                actions.appendChild(
                    editButton
                );

                actions.appendChild(
                    deleteButton
                );


                element.appendChild(name);

                element.appendChild(actions);

                container.appendChild(element);

            });

        }


        /* =========================================================
           GROUP FORM
           ========================================================= */

        function openGroupForm(groupId = null) {

            editingCompanyId =
                groupId;

            editingIsGroup =
                true;


            const title =
                document.getElementById(
                    "formTitle"
                );

            const input =
                document.getElementById(
                    "nameInput"
                );

            const groupContainer =
                document.getElementById(
                    "groupSelectContainer"
                );

            const saveButton =
                document.getElementById(
                    "formSaveButton"
                );


            groupContainer.style.display =
                "none";


            if (groupId === null) {

                title.textContent =
                    "Add Group";

                input.value =
                    "";

                saveButton.textContent =
                    "Add";

            }
            else {

                const group =
                    companies.find(
                        item =>
                            item.id === groupId &&
                            item.is_group
                    );


                if (!group) {
                    return;
                }


                title.textContent =
                    "Edit Group";

                input.value =
                    group.name;

                saveButton.textContent =
                    "Save";

            }


            document
                .getElementById(
                    "formModal"
                )
                .classList.add("show");


            setTimeout(
                function () {

                    input.focus();

                },
                50
            );

        }


        /* =========================================================
           COMPANY FORM
           ========================================================= */

        function openCompanyForm(companyId = null) {

            editingCompanyId =
                companyId;

            editingIsGroup =
                false;


            const title =
                document.getElementById(
                    "formTitle"
                );

            const input =
                document.getElementById(
                    "nameInput"
                );

            const groupContainer =
                document.getElementById(
                    "groupSelectContainer"
                );

            const groupSelect =
                document.getElementById(
                    "groupSelect"
                );

            const saveButton =
                document.getElementById(
                    "formSaveButton"
                );


            groupContainer.style.display =
                "block";


            fillGroupSelect();


            if (companyId === null) {

                title.textContent =
                    "Add Company";

                input.value =
                    "";

                groupSelect.value =
                    "";

                saveButton.textContent =
                    "Add";

            }
            else {

                const company =
                    companies.find(
                        item =>
                            item.id === companyId &&
                            !item.is_group
                    );


                if (!company) {
                    return;
                }


                title.textContent =
                    "Edit Company";

                input.value =
                    company.name;

                groupSelect.value =
                    company.group_id || "";

                saveButton.textContent =
                    "Save";

            }


            document
                .getElementById(
                    "formModal"
                )
                .classList.add("show");


            setTimeout(
                function () {

                    input.focus();

                },
                50
            );

        }


        /* =========================================================
           FILL GROUP SELECT
           ========================================================= */

        function fillGroupSelect() {

            const select =
                document.getElementById(
                    "groupSelect"
                );


            select.innerHTML = "";


            const noGroup =
                document.createElement("option");

            noGroup.value =
                "";

            noGroup.textContent =
                "No Group";

            select.appendChild(
                noGroup
            );


            companies
                .filter(
                    item => item.is_group
                )
                .forEach(group => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        group.id;

                    option.textContent =
                        group.name;

                    select.appendChild(
                        option
                    );

                });

        }


        /* =========================================================
           SAVE COMPANY FORM
           ========================================================= */

        async function saveCompanyForm() {

            const input =
                document.getElementById(
                    "nameInput"
                );


            const name =
                input.value.trim();


            if (!name) {

                alert(
                    "Please enter a name."
                );

                input.focus();

                return;

            }


            const saveButton =
                document.getElementById(
                    "formSaveButton"
                );


            saveButton.disabled =
                true;

            saveButton.textContent =
                "Saving...";


            try {

                /* GROUP */

                if (editingIsGroup) {

                    if (
                        editingCompanyId === null
                    ) {

                        const {
                            data,
                            error
                        } =
                            await supabaseClient
                                .from("companies")
                                .insert({
                                    name: name,
                                    group_id: null,
                                    is_group: true
                                })
                                .select()
                                .single();


                        if (error) {
                            throw error;
                        }


                        companies.push(data);

                        showStatus(
                            "Group added."
                        );

                    }
                    else {

                        const oldGroup =
                            companies.find(
                                item =>
                                    item.id ===
                                    editingCompanyId
                            );


                        if (!oldGroup) {
                            return;
                        }


                        const {
                            error
                        } =
                            await supabaseClient
                                .from("companies")
                                .update({
                                    name: name
                                })
                                .eq(
                                    "id",
                                    editingCompanyId
                                );


                        if (error) {
                            throw error;
                        }


                        oldGroup.name =
                            name;


                        showStatus(
                            "Group updated."
                        );

                    }


                    closeFormModal();

                    createCompanyList();

                    renderManagementList();

                    return;
                }


                /* COMPANY */

                const groupSelect =
                    document.getElementById(
                        "groupSelect"
                    );


                const groupId =
                    groupSelect.value
                        ? Number(
                            groupSelect.value
                        )
                        : null;


                if (
                    editingCompanyId === null
                ) {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .from("companies")
                            .insert({
                                name: name,
                                group_id: groupId,
                                is_group: false
                            })
                            .select()
                            .single();


                    if (error) {
                        throw error;
                    }


                    companies.push(data);

                    showStatus(
                        "Company added."
                    );

                }
                else {

                    const company =
                        companies.find(
                            item =>
                                item.id ===
                                editingCompanyId &&
                                !item.is_group
                        );


                    if (!company) {
                        return;
                    }


                    const oldName =
                        company.name;


                    const {
                        error
                    } =
                        await supabaseClient
                            .from("companies")
                            .update({
                                name: name,
                                group_id: groupId
                            })
                            .eq(
                                "id",
                                editingCompanyId
                            );


                    if (error) {
                        throw error;
                    }


                    /* Update existing schedule
                       if company name changed */

                    if (
                        oldName !== name
                    ) {

                        const {
                            error: scheduleError
                        } =
                            await supabaseClient
                                .from(
                                    "weekly_schedule"
                                )
                                .update({
                                    company: name
                                })
                                .eq(
                                    "company",
                                    oldName
                                );


                        if (scheduleError) {

                            console.error(
                                "Schedule update error:",
                                scheduleError
                            );

                        }


                        updateLocalScheduleCompanyName(
                            oldName,
                            name
                        );

                    }


                    company.name =
                        name;

                    company.group_id =
                        groupId;


                    showStatus(
                        "Company updated."
                    );

                }


                closeFormModal();

                createCompanyList();

                renderManagementList();

                renderSchedule();

            }
            catch (error) {

                console.error(error);

                showStatus(
                    "Could not save the company."
                );

            }
            finally {

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    editingCompanyId === null
                        ? "Add"
                        : "Save";

            }

        }


        /* =========================================================
           UPDATE LOCAL SCHEDULE COMPANY NAME
           ========================================================= */

        function updateLocalScheduleCompanyName(
            oldName,
            newName
        ) {

            Object.keys(schedule)
                .forEach(key => {

                    schedule[key] =
                        schedule[key].map(
                            company =>
                                company === oldName
                                    ? newName
                                    : company
                        );

                });


            savedSchedule =
                cloneSchedule(
                    schedule
                );

        }


        /* =========================================================
           DELETE COMPANY
           ========================================================= */

        async function deleteCompany(company) {

            const confirmed =
                confirm(
                    "Delete \"" +
                    company.name +
                    "\"?\n\nIf this company is already used in the weekly planner, it will also be removed from the saved schedule."
                );


            if (!confirmed) {
                return;
            }


            try {

                /* Remove from weekly schedule */

                const {
                    error: scheduleError
                } =
                    await supabaseClient
                        .from(
                            "weekly_schedule"
                        )
                        .delete()
                        .eq(
                            "company",
                            company.name
                        );


                if (scheduleError) {
                    throw scheduleError;
                }


                /* Remove company */

                const {
                    error
                } =
                    await supabaseClient
                        .from("companies")
                        .delete()
                        .eq(
                            "id",
                            company.id
                        );


                if (error) {
                    throw error;
                }


                companies =
                    companies.filter(
                        item =>
                            item.id !==
                            company.id
                    );


                removeLocalScheduleCompany(
                    company.name
                );


                savedSchedule =
                    cloneSchedule(
                        schedule
                    );


                hasUnsavedChanges = false;

                clearMobileSelection();

                updateButtons();

                createCompanyList();

                renderManagementList();

                renderSchedule();


                showStatus(
                    "Company deleted."
                );

            }
            catch (error) {

                console.error(error);

                showStatus(
                    "Could not delete the company."
                );

            }

        }


        /* =========================================================
           DELETE GROUP
           ========================================================= */

        async function deleteGroup(group) {

            const children =
                companies.filter(
                    item =>
                        !item.is_group &&
                        item.group_id === group.id
                );


            let message =
                "Delete group \"" +
                group.name +
                "\"?";


            if (children.length > 0) {

                message +=
                    "\n\nThis group contains " +
                    children.length +
                    " company/companies.";

                message +=
                    "\nThey will also be deleted from the company list and weekly planner.";

            }


            const confirmed =
                confirm(message);


            if (!confirmed) {
                return;
            }


            try {

                const childNames =
                    children.map(
                        child =>
                            child.name
                    );


                /* Remove children from schedule */

                for (
                    const companyName
                    of childNames
                ) {

                    const {
                        error
                    } =
                        await supabaseClient
                            .from(
                                "weekly_schedule"
                            )
                            .delete()
                            .eq(
                                "company",
                                companyName
                            );


                    if (error) {
                        throw error;
                    }

                }


                /* Delete group */

                const {
                    error
                } =
                    await supabaseClient
                        .from("companies")
                        .delete()
                        .eq(
                            "id",
                            group.id
                        );


                if (error) {
                    throw error;
                }


                const idsToRemove =
                    new Set([
                        group.id,
                        ...children.map(
                            child =>
                                child.id
                        )
                    ]);


                companies =
                    companies.filter(
                        item =>
                            !idsToRemove.has(
                                item.id
                            )
                    );


                childNames.forEach(
                    companyName => {

                        removeLocalScheduleCompany(
                            companyName
                        );

                    }
                );


                savedSchedule =
                    cloneSchedule(
                        schedule
                    );


                hasUnsavedChanges = false;

                clearMobileSelection();

                updateButtons();

                createCompanyList();

                renderManagementList();

                renderSchedule();


                showStatus(
                    "Group deleted."
                );

            }
            catch (error) {

                console.error(error);

                showStatus(
                    "Could not delete the group."
                );

            }

        }


        /* =========================================================
           REMOVE COMPANY FROM LOCAL SCHEDULE
           ========================================================= */

        function removeLocalScheduleCompany(
            companyName
        ) {

            Object.keys(schedule)
                .forEach(key => {

                    schedule[key] =
                        schedule[key].filter(
                            company =>
                                company !==
                                companyName
                        );


                    if (
                        schedule[key].length === 0
                    ) {

                        delete schedule[key];

                    }

                });

        }


        /* =========================================================
           CLOSE FORM
           ========================================================= */

        function closeFormModal() {

            document
                .getElementById(
                    "formModal"
                )
                .classList.remove("show");


            document
                .getElementById(
                    "nameInput"
                )
                .value = "";


            editingCompanyId =
                null;

            editingIsGroup =
                false;

        }


        /* =========================================================
           STATUS MESSAGE
           ========================================================= */

        function showStatus(message) {

            const element =
                document.getElementById(
                    "statusMessage"
                );


            element.textContent =
                message;


            element.classList.add(
                "show"
            );


            setTimeout(
                function () {

                    element.classList.remove(
                        "show"
                    );

                },
                2500
            );

        }


        /* =========================================================
           WARN BEFORE LEAVING
           ========================================================= */

        window.addEventListener(
            "beforeunload",
            function (event) {

                if (!hasUnsavedChanges) {
                    return;
                }


                event.preventDefault();

                event.returnValue = "";

            }
        );

    </script>
