<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Work Planner</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================================================
           LOGIN SCREEN
           ========================================================= */

        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f5f6fa;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-box h1 {
            margin: 0 0 8px 0;
            text-align: center;
            font-size: 24px;
        }

        .login-subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .login-label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .login-input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }

        .login-input:focus {
            border-color: #4a44f2;
        }

        .login-button {
            width: 100%;
            border: none;
            background: #4a44f2;
            color: white;
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .login-button:hover {
            background: #3934c9;
        }

        .login-error {
            display: none;
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
            padding: 9px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-error.show {
            display: block;
        }

        /* =========================================================
           APP
           ========================================================= */

        #app {
            display: none;
            min-height: 100vh;
        }

        #app.show {
            display: block;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            min-height: 70px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            white-space: nowrap;
        }

        .unsaved {
            display: none;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffe69c;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
        }

        .unsaved.show {
            display: inline-block;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .save-btn,
        .discard-btn,
        .reset-btn,
        .manage-btn,
        .logout-btn {
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        .save-btn {
            background: #198754;
        }

        .save-btn:hover {
            background: #157347;
        }

        .save-btn:disabled {
            background: #adb5bd;
            cursor: not-allowed;
        }

        .discard-btn {
            background: #6c757d;
        }

        .discard-btn:hover {
            background: #5c636a;
        }

        .discard-btn:disabled {
            background: #adb5bd;
            cursor: not-allowed;
        }

        .reset-btn {
            background: #dc3545;
        }

        .reset-btn:hover {
            background: #bb2d3b;
        }

        .manage-btn {
            background: #4a44f2;
        }

        .manage-btn:hover {
            background: #3934c9;
        }

        .logout-btn {
            background: #343a40;
        }

        .logout-btn:hover {
            background: #212529;
        }

        /* =========================================================
           MAIN
           ========================================================= */

        .main {
            display: flex;
            gap: 15px;
            padding: 15px;
            height: calc(100vh - 70px);
            min-height: 0;
        }

        /* =========================================================
           SIDEBAR
           ========================================================= */

        .sidebar {
            width: 220px;
            min-width: 220px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .sidebar-info {
            font-size: 12px;
            color: #777;
            margin-bottom: 10px;
        }

        .company-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            padding-right: 5px;
        }

        .company-list::-webkit-scrollbar {
            width: 6px;
        }

        .company-list::-webkit-scrollbar-thumb {
            background: #bbb;
            border-radius: 10px;
        }

        /* =========================================================
           COMPANY CARDS
           ========================================================= */

        .company-card {
            background: #f2f2f2;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 9px;
            cursor: grab;
            font-size: 13px;
            user-select: none;
            touch-action: manipulation;
            word-break: break-word;
            transition: border 0.15s, box-shadow 0.15s;
        }

        .company-card:hover {
            background: #e8e8e8;
        }

        .company-card:active {
            cursor: grabbing;
        }

        /* Selected company on mobile */
        .company-card.mobile-selected {
            border: 2px solid #4a44f2;
            box-shadow: 0 0 0 2px rgba(74, 68, 242, 0.12);
            background: #eef0ff;
        }

        /* =========================================================
           GROUPS
           ========================================================= */

        .company-group {
            background: #f2f2f2;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .company-group-header {
            padding: 9px;
            cursor: grab;
            font-size: 13px;
            font-weight: bold;
            user-select: none;
            word-break: break-word;
        }

        .company-group-header:hover {
            background: #e8e8e8;
        }

        .company-group-children {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-left: 15px;
            margin-top: 5px;
            margin-bottom: 7px;
            margin-right: 5px;
        }

        .company-group-children .company-card {
            border-left: 4px solid #9b9ff2;
        }

        /* =========================================================
           PLANNER
           ========================================================= */

        .planner {
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .grid {
            display: grid;
            grid-template-columns: 70px repeat(5, minmax(160px, 1fr));
            min-width: 870px;
        }

        .grid-header {
            background: #4a44f2;
            color: white;
            padding: 12px 8px;
            text-align: center;
            font-weight: bold;
            border-right: 1px solid rgba(255,255,255,0.3);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .time-cell {
            background: #fafafa;
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #666;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-zone {
            min-height: 80px;
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: white;
            transition: background 0.15s;
        }

        .drop-zone.drag-over {
            background: #eef0ff;
        }

        /* Selected drop zone on mobile */
        .drop-zone.mobile-target {
            background: #f1f0ff;
            box-shadow: inset 0 0 0 2px rgba(74, 68, 242, 0.35);
        }

        /* =========================================================
           PLACED COMPANIES
           ========================================================= */

        .placed-company {
            background: #a0d1ff;
            border-radius: 5px;
            padding: 7px 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            cursor: grab;
            user-select: none;
            min-height: 32px;
            touch-action: manipulation;
            transition: border 0.15s, box-shadow 0.15s;
        }

        .placed-company:active {
            cursor: grabbing;
        }

        .placed-company span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            flex: 1;
        }

        /* Selected placed company on mobile */
        .placed-company.mobile-selected {
            border: 2px solid #4a44f2;
            box-shadow: 0 0 0 2px rgba(74, 68, 242, 0.12);
        }

        .remove-btn {
            border: none;
            background: transparent;
            color: #b00020;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            flex-shrink: 0;
        }

        .remove-btn:hover {
            color: #ff0000;
        }

        /* =========================================================
           STATUS
           ========================================================= */

        .status-message {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 9px 15px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
            z-index: 3000;
        }

        .status-message.show {
            display: block;
        }

        /* =========================================================
           COMPANY MANAGEMENT MODAL
           ========================================================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            z-index: 2000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .company-modal {
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 15px 18px;
            border-bottom: 1px solid #ddd;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .modal-close {
            border: none;
            background: transparent;
            font-size: 26px;
            cursor: pointer;
            color: #555;
            line-height: 1;
        }

        .modal-close:hover {
            color: #000;
        }

        .modal-body {
            padding: 15px 18px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .add-group-btn,
        .add-company-btn {
            border: none;
            color: white;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-group-btn {
            background: #4a44f2;
        }

        .add-company-btn {
            background: #198754;
        }

        .management-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .management-group {
            border: 1px solid #ddd;
            border-radius: 7px;
            overflow: hidden;
        }

        .management-group-header {
            background: #f2f2f2;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-weight: bold;
        }

        .management-group-name {
            min-width: 0;
            word-break: break-word;
        }

        .management-company {
            padding: 8px 10px 8px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-top: 1px solid #eee;
            background: white;
        }

        .management-company-name {
            min-width: 0;
            word-break: break-word;
            font-size: 13px;
        }

        .management-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .edit-company-btn,
        .delete-company-btn {
            border: none;
            border-radius: 5px;
            padding: 5px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .edit-company-btn {
            background: #e7e5ff;
            color: #3934c9;
        }

        .delete-company-btn {
            background: #ffe2e5;
            color: #b00020;
        }

        .management-standalone {
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: white;
        }

        .empty-management {
            text-align: center;
            color: #777;
            padding: 25px 10px;
            border: 1px dashed #ccc;
            border-radius: 7px;
        }

        /* =========================================================
           FORM MODAL
           ========================================================= */

        .form-modal {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 18px;
        }

        .form-modal h3 {
            margin: 0 0 15px 0;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }

        .form-cancel,
        .form-save {
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .form-cancel {
            background: #6c757d;
            color: white;
        }

        .form-save {
            background: #198754;
            color: white;
        }

        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 1000px) {

            .main {
                gap: 10px;
                padding: 10px;
            }

            .sidebar {
                width: 200px;
                min-width: 200px;
            }

            .grid {
                grid-template-columns:
                    65px
                    repeat(5, minmax(150px, 1fr));

                min-width: 815px;
            }
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            .header {
                min-height: auto;
                padding: 8px 10px;
                flex-direction: column;
                align-items: stretch;
                gap: 7px;
                position: sticky;
                top: 0;
                z-index: 20;
            }

            .header-left {
                justify-content: space-between;
            }

            .header h1 {
                font-size: 18px;
            }

            .unsaved {
                font-size: 10px;
                padding: 5px 7px;
            }

            .header-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
                width: 100%;
            }

            .save-btn,
            .discard-btn,
            .reset-btn,
            .manage-btn,
            .logout-btn {
                width: 100%;
                padding: 8px 4px;
                font-size: 9px;
            }

            .main {
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 115px);
                padding: 10px;
                gap: 10px;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 220px;
                min-height: 220px;
                border-radius: 8px;
                padding: 10px;
            }

            .sidebar h2 {
                font-size: 17px;
                margin-bottom: 6px;
            }

            .sidebar-info {
                font-size: 11px;
                margin-bottom: 7px;
            }

            .company-list {
                gap: 6px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .company-card {
                padding: 10px;
                font-size: 13px;
                min-height: 38px;
                display: flex;
                align-items: center;
            }

            .company-group-header {
                padding: 10px;
                font-size: 13px;
                min-height: 38px;
                display: flex;
                align-items: center;
            }

            .planner {
                width: 100%;
                height: calc(100vh - 345px);
                min-height: 400px;
                overflow-x: auto;
                overflow-y: auto;
                border-radius: 8px;
                -webkit-overflow-scrolling: touch;
            }

            .grid {
                grid-template-columns:
                    60px
                    repeat(5, 145px);

                min-width: 785px;
            }

            .grid-header {
                padding: 10px 5px;
                font-size: 12px;
                min-height: 42px;
                display: flex;
                align-items: center;
                justify-content: center;
                position: sticky;
                top: 0;
                z-index: 5;
            }

            .time-cell {
                min-height: 70px;
                padding: 5px;
                font-size: 11px;
                position: sticky;
                left: 0;
                z-index: 3;
            }

            .drop-zone {
                min-height: 70px;
                padding: 4px;
                gap: 4px;
            }

            .placed-company {
                padding: 7px 6px;
                font-size: 11px;
                min-height: 31px;
            }

            .remove-btn {
                font-size: 17px;
            }

            .modal-overlay {
                padding: 8px;
            }

            .company-modal {
                max-height: 94vh;
            }

            .modal-header {
                padding: 12px;
            }

            .modal-body {
                padding: 12px;
            }

            .modal-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .add-group-btn,
            .add-company-btn {
                width: 100%;
            }
        }

        /* =========================================================
           VERY SMALL MOBILE
           ========================================================= */

        @media (max-width: 400px) {

            .header h1 {
                font-size: 16px;
            }

            .unsaved {
                font-size: 9px;
            }

            .sidebar {
                height: 200px;
                min-height: 200px;
            }

            .planner {
                height: calc(100vh - 325px);
                min-height: 380px;
            }

            .grid {
                grid-template-columns:
                    55px
                    repeat(5, 135px);

                min-width: 730px;
            }

            .grid-header {
                font-size: 11px;
            }

            .time-cell {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         LOGIN SCREEN
         ========================================================= -->

    <div id="loginScreen" class="login-screen">

        <div class="login-box">

            <h1>
                Weekly Work Planner
            </h1>

            <div class="login-subtitle">
                Please sign in to continue
            </div>

            <div id="loginError" class="login-error">
                Invalid username or password.
            </div>

            <label class="login-label" for="usernameInput">
                Username
            </label>

            <input
                id="usernameInput"
                class="login-input"
                type="text"
                autocomplete="username"
                placeholder="Username">

            <label class="login-label" for="passwordInput">
                Password
            </label>

            <input
                id="passwordInput"
                class="login-input"
                type="password"
                autocomplete="current-password"
                placeholder="Password">

            <button
                class="login-button"
                onclick="login()">

                Login

            </button>

        </div>

    </div>


    <!-- =========================================================
         APPLICATION
         ========================================================= -->

    <div id="app">

        <!-- HEADER -->

        <div class="header">

            <div class="header-left">

                <h1>
                    Weekly Work Planner
                </h1>

                <span
                    id="unsavedIndicator"
                    class="unsaved">

                    Unsaved changes

                </span>

            </div>

            <div class="header-buttons">

                <button
                    class="manage-btn"
                    onclick="openCompanyManager()">

                    Manage Companies

                </button>

                <button
                    id="saveButton"
                    class="save-btn"
                    onclick="saveChanges()"
                    disabled>

                    Save Changes

                </button>

                <button
                    id="discardButton"
                    class="discard-btn"
                    onclick="discardChanges()"
                    disabled>

                    Discard

                </button>

                <button
                    class="reset-btn"
                    onclick="resetPlanner()">

                    Reset

                </button>

                <button
                    class="logout-btn"
                    onclick="logout()">

                    Logout

                </button>

            </div>

        </div>


        <!-- MAIN -->

        <div class="main">

            <!-- SIDEBAR -->

            <aside class="sidebar">

                <h2>
                    Companies
                </h2>

                <!-- <div class="sidebar-info">
                    Desktop: drag a company. Mobile: tap a company, then tap a day/time.
                </div> -->

                <div
                    id="companyList"
                    class="company-list">
                </div>

            </aside>


            <!-- PLANNER -->

            <main class="planner">

                <div
                    id="plannerGrid"
                    class="grid">
                </div>

            </main>

        </div>


        <!-- COMPANY MANAGEMENT MODAL -->

        <div
            id="companyManagerModal"
            class="modal-overlay">

            <div class="company-modal">

                <div class="modal-header">

                    <h2>
                        Manage Companies
                    </h2>

                    <button
                        class="modal-close"
                        onclick="closeCompanyManager()">

                        ×

                    </button>

                </div>

                <div class="modal-body">

                    <div class="modal-actions">

                        <button
                            class="add-group-btn"
                            onclick="openGroupForm()">

                            + Add Group

                        </button>

                        <button
                            class="add-company-btn"
                            onclick="openCompanyForm()">

                            + Add Company

                        </button>

                    </div>

                    <div
                        id="managementList"
                        class="management-list">
                    </div>

        /* =========================================================
           SUPABASE
           ========================================================= */

        const SUPABASE_URL =
            "https://jklrgyghnsfwtalmlkwq.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_n_oBUjO2BF8e3x8P_cRdHg_WaszR6w1";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================================
           DAYS
           ========================================================= */

        const days = [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday"
        ];


        /* =========================================================

        const times = [

            "13:00",

        /* =========================================================
           VARIABLES
           ========================================================= */

        let companies = [];

        let schedule = {};

        let savedSchedule = {};

        let hasUnsavedChanges = false;

        let draggedData = null;

        let draggedExisting = null;

        let editingCompanyId = null;

        let editingIsGroup = false;

        /*
         * Mobile selection.
         *
         * source:
         * - sidebar
         * - group
         * - existing
         */
        let mobileSelection = null;


        /* =========================================================
           START
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                const loggedIn =
                    sessionStorage.getItem(
                        "weeklyPlannerLoggedIn"

                if (loggedIn === "true") {
