<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Work Planner</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            min-height: 70px;
            background: white;
            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 10px 20px;

            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            white-space: nowrap;
        }

        .unsaved {
            display: none;

            background: #fff3cd;
            color: #856404;

            border: 1px solid #ffe69c;

            padding: 6px 10px;

            border-radius: 5px;

            font-size: 12px;

            white-space: nowrap;
        }

        .unsaved.show {
            display: inline-block;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .save-btn,
        .discard-btn,
        .reset-btn {
            border: none;

            color: white;

            padding: 10px 14px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            white-space: nowrap;
        }

        .save-btn {
            background: #198754;
        }

        .save-btn:hover {
            background: #157347;
        }

        .save-btn:disabled {
            background: #adb5bd;
            cursor: not-allowed;
        }

        .discard-btn {
            background: #6c757d;
        }

        .discard-btn:hover {
            background: #5c636a;
        }

        .discard-btn:disabled {
            background: #adb5bd;
            cursor: not-allowed;
        }

        .reset-btn {
            background: #dc3545;
        }

        .reset-btn:hover {
            background: #bb2d3b;
        }


        /* =========================================================
           MAIN
           ========================================================= */

        .main {
            display: flex;

            gap: 15px;

            padding: 15px;

            height: calc(100vh - 70px);

            min-height: 0;
        }


        /* =========================================================
           SIDEBAR
           ========================================================= */

        .sidebar {
            width: 220px;
            min-width: 220px;

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 12px;

            height: calc(100vh - 100px);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .sidebar h2 {
            margin: 0 0 10px 0;

            font-size: 18px;
        }

        .sidebar-info {
            font-size: 12px;

            color: #777;

            margin-bottom: 10px;
        }

        .company-list {
            display: flex;

            flex-direction: column;

            gap: 8px;

            overflow-y: auto;

            flex: 1;

            min-height: 0;

            padding-right: 5px;
        }

        .company-list::-webkit-scrollbar {
            width: 6px;
        }

        .company-list::-webkit-scrollbar-thumb {
            background: #bbb;

            border-radius: 10px;
        }


        /* =========================================================
           COMPANY CARDS
           ========================================================= */

        .company-card {
            background: #f2f2f2;

            border: 1px solid #ddd;

            border-radius: 6px;

            padding: 9px;

            cursor: grab;

            font-size: 13px;

            user-select: none;

            touch-action: manipulation;

            word-break: break-word;
        }

        .company-card:hover {
            background: #e8e8e8;
        }

        .company-card:active {
            cursor: grabbing;
        }


        /* =========================================================
           GROUPS
           ========================================================= */

        .company-group {
            background: #f2f2f2;

            border: 1px solid #ddd;

            border-radius: 6px;

            overflow: hidden;
        }

        .company-group-header {
            padding: 9px;

            cursor: grab;

            font-size: 13px;

            font-weight: bold;

            user-select: none;

            word-break: break-word;
        }

        .company-group-header:hover {
            background: #e8e8e8;
        }

        .company-group-children {
            display: flex;

            flex-direction: column;

            gap: 6px;

            margin-left: 15px;

            margin-top: 5px;

            margin-bottom: 7px;

            margin-right: 5px;
        }

        .company-group-children .company-card {
            border-left: 4px solid #9b9ff2;
        }


        /* =========================================================
           PLANNER
           ========================================================= */

        .planner {
            flex: 1;

            min-width: 0;
            min-height: 0;

            overflow: auto;

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            -webkit-overflow-scrolling: touch;
        }

        .grid {
            display: grid;

            grid-template-columns:
                70px
                repeat(5, minmax(160px, 1fr));

            min-width: 870px;
        }

        .grid-header {
            background: #4a44f2;

            color: white;

            padding: 12px 8px;

            text-align: center;

            font-weight: bold;

            border-right:
                1px solid rgba(255,255,255,0.3);

            position: sticky;

            top: 0;

            z-index: 5;
        }

        .time-cell {
            background: #fafafa;

            border-right: 1px solid #ddd;

            border-bottom: 1px solid #ddd;

            padding: 8px;

            text-align: center;

            font-size: 12px;

            font-weight: bold;

            color: #666;

            min-height: 80px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .drop-zone {
            min-height: 80px;

            border-right: 1px solid #ddd;

            border-bottom: 1px solid #ddd;

            padding: 5px;

            display: flex;

            flex-direction: column;

            gap: 5px;

            background: white;

            transition: background 0.15s;
        }

        .drop-zone.drag-over {
            background: #eef0ff;
        }


        /* =========================================================
           PLACED COMPANIES
           ========================================================= */

        .placed-company {
            background: #a0d1ff;

            border-radius: 5px;

            padding: 7px 8px;

            font-size: 12px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 5px;

            cursor: grab;

            user-select: none;

            min-height: 32px;

            touch-action: manipulation;
        }

        .placed-company:active {
            cursor: grabbing;
        }

        .placed-company span {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            min-width: 0;

            flex: 1;
        }

        .remove-btn {
            border: none;

            background: transparent;

            color: #b00020;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            padding: 0 2px;

            line-height: 1;

            flex-shrink: 0;
        }

        .remove-btn:hover {
            color: #ff0000;
        }


        /* =========================================================
           STATUS
           ========================================================= */

        .status-message {
            position: fixed;

            bottom: 15px;

            left: 50%;

            transform: translateX(-50%);

            background: #333;

            color: white;

            padding: 9px 15px;

            border-radius: 6px;

            font-size: 12px;

            display: none;

            z-index: 1000;
        }

        .status-message.show {
            display: block;
        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 1000px) {

            .main {
                gap: 10px;

                padding: 10px;
            }

            .sidebar {
                width: 200px;

                min-width: 200px;
            }

            .grid {
                grid-template-columns:
                    65px
                    repeat(5, minmax(150px, 1fr));

                min-width: 815px;
            }

        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            .header {
                min-height: auto;

                padding: 8px 10px;

                flex-direction: column;

                align-items: stretch;

                gap: 7px;

                position: sticky;

                top: 0;

                z-index: 20;
            }

            .header-left {
                justify-content: space-between;
            }

            .header h1 {
                font-size: 18px;
            }

            .unsaved {
                font-size: 10px;

                padding: 5px 7px;
            }

            .header-buttons {
                display: grid;

                grid-template-columns:
                    1fr 1fr 1fr;

                width: 100%;
            }

            .save-btn,
            .discard-btn,
            .reset-btn {
                width: 100%;

                padding: 8px 5px;

                font-size: 11px;
            }


            .main {
                display: flex;

                flex-direction: column;

                height: auto;

                min-height: calc(100vh - 115px);

                padding: 10px;

                gap: 10px;
            }


            .sidebar {
                width: 100%;

                min-width: 0;

                height: 220px;

                min-height: 220px;

                border-radius: 8px;

                padding: 10px;
            }

            .sidebar h2 {
                font-size: 17px;

                margin-bottom: 6px;
            }

            .sidebar-info {
                font-size: 11px;

                margin-bottom: 7px;
            }

            .company-list {
                gap: 6px;

                overflow-y: auto;

                -webkit-overflow-scrolling: touch;
            }

            .company-card {
                padding: 10px;

                font-size: 13px;

                min-height: 38px;

                display: flex;

                align-items: center;
            }

            .company-group-header {
                padding: 10px;

                font-size: 13px;

                min-height: 38px;

                display: flex;

                align-items: center;
            }


            .planner {
                width: 100%;

                height: calc(100vh - 345px);

                min-height: 400px;

                overflow-x: auto;

                overflow-y: auto;

                border-radius: 8px;

                -webkit-overflow-scrolling: touch;
            }

            .grid {
                grid-template-columns:
                    60px
                    repeat(5, 145px);

                min-width: 785px;
            }

            .grid-header {
                padding: 10px 5px;

                font-size: 12px;

                min-height: 42px;

                display: flex;

                align-items: center;

                justify-content: center;

                position: sticky;

                top: 0;

                z-index: 5;
            }

            .time-cell {
                min-height: 70px;

                padding: 5px;

                font-size: 11px;

                position: sticky;

                left: 0;

                z-index: 3;
            }

            .drop-zone {
                min-height: 70px;

                padding: 4px;

                gap: 4px;
            }

            .placed-company {
                padding: 7px 6px;

                font-size: 11px;

                min-height: 31px;
            }

            .remove-btn {
                font-size: 17px;
            }

        }


        /* =========================================================
           VERY SMALL MOBILE
           ========================================================= */

        @media (max-width: 400px) {

            .header h1 {
                font-size: 16px;
            }

            .unsaved {
                font-size: 9px;
            }

            .sidebar {
                height: 200px;

                min-height: 200px;
            }

            .planner {
                height: calc(100vh - 325px);

                min-height: 380px;
            }

            .grid {
                grid-template-columns:
                    55px
                    repeat(5, 135px);

                min-width: 730px;
            }

            .grid-header {
                font-size: 11px;
            }

            .time-cell {
                font-size: 10px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================================================
         HEADER
         ========================================================= -->

    <div class="header">

        <div class="header-left">

            <h1>
                Weekly Work Planner
            </h1>

            <span
                id="unsavedIndicator"
                class="unsaved">

                Unsaved changes

            </span>

        </div>


        <div class="header-buttons">

            <button
                id="saveButton"
                class="save-btn"
                onclick="saveChanges()"
                disabled>

                Save Changes

            </button>


            <button
                id="discardButton"
                class="discard-btn"
                onclick="discardChanges()"
                disabled>

                Discard

            </button>


            <button
                class="reset-btn"
                onclick="resetPlanner()">

                Reset

            </button>

        </div>

    </div>


    <!-- =========================================================
         MAIN
         ========================================================= -->

    <div class="main">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>
                Companies
            </h2>

            <div class="sidebar-info">
                Drag a company or a group to a day and time.
            </div>

            <div
                id="companyList"
                class="company-list">
            </div>

        </aside>


        <!-- PLANNER -->

        <main class="planner">

            <div
                id="plannerGrid"
                class="grid">
            </div>

        </main>

    </div>


    <!-- STATUS -->

    <div
        id="statusMessage"
        class="status-message">
    </div>


    <script>

        /* =========================================================
           SUPABASE
           ========================================================= */

        const SUPABASE_URL =
            "https://jklrgyghnsfwtalmlkwq.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_n_oBUjO2BF8e3x8P_cRdHg_WaszR6w1";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================================
           COMPANIES
           ========================================================= */

         const companies = [

        {
                name: "Danmark",
                children: [
                    "XL MØBLER ApS",
                    "Fårup Furniture (Møbelkompagniet)",
                    "BOBO ApS",
                    "BFT",
                    "Stenløse Havemøbelcenter",
                    "Salesstyling Aps",
                    "Other"
                ]
            },

            {
                name: "Furniture1 Hungary",
                children: [
                    "Croatia",
                    "Romania",
                    "Bulgarien",
                    "Hungary",
                    "Slovenia"
                ]
            },

            {
                name: "Furniture1 Lithuania",
                children: [
                    "EStonia",
                    "Lithuania",
                    "Latvia"
                ]
            },

            {       
                name: "Furniture1 Germany",
                children: [
                    "United Kingdom",
                    "Ireland",
                    "Netherlands"
                ]
            },

            "AKL TRADE OÜ",
            "PK Invest ApS",
            "SELSEY Sp. z o.o.",

            

            "Sohome b.v.",
            "CONDI SERVICES",
            "Otto Group",

            "Skeidar Holding AS",
            "Ellos NO"

        ];


        /* =========================================================
           DAYS
           ========================================================= */

        const days = [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday"
        ];


        /* =========================================================
           TIMES
           ========================================================= */

        const times = [
            "07:00",
            "08:00",
            "09:00",
            "10:00",
            "11:00",
            "12:00",
            "13:00",
            "14:00",
            "15:00",
            "16:00"
        ];


        /* =========================================================
           VARIABLES
           ========================================================= */

        let schedule = {};

        let savedSchedule = {};

        let hasUnsavedChanges = false;

        let draggedData = null;

        let draggedExisting = null;


        /* =========================================================
           START
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                createCompanyList();

                createPlanner();

                await loadSchedule();

            }
        );


        /* =========================================================
           COMPANY LIST
           ========================================================= */

        function createCompanyList() {

            const container =
                document.getElementById(
                    "companyList"
                );

            container.innerHTML = "";


            companies.forEach(item => {


                /* SINGLE COMPANY */

                if (typeof item === "string") {

                    const card =
                        document.createElement("div");

                    card.className =
                        "company-card";

                    card.textContent =
                        item;

                    card.draggable = true;


                    card.addEventListener(
                        "dragstart",
                        function () {

                            draggedData = {
                                source: "sidebar",
                                company: item
                            };

                        }
                    );


                    container.appendChild(card);

                    return;
                }


                /* GROUP */

                const group =
                    document.createElement("div");

                group.className =
                    "company-group";


                const header =
                    document.createElement("div");

                header.className =
                    "company-group-header";

                header.textContent =
                    "▶ " + item.name;

                header.draggable = true;


                const childrenContainer =
                    document.createElement("div");

                childrenContainer.className =
                    "company-group-children";

                childrenContainer.style.display =
                    "none";


                /* Group drag */

                header.addEventListener(
                    "dragstart",
                    function () {

                        draggedData = {
                            source: "group",
                            companies: item.children
                        };

                    }
                );


                /* Open / close */

                header.addEventListener(
                    "click",
                    function () {

                        const hidden =
                            childrenContainer.style.display ===
                            "none";


                        childrenContainer.style.display =
                            hidden ? "flex" : "none";


                        header.textContent =
                            (hidden ? "▼ " : "▶ ")
                            + item.name;

                    }
                );


                /* Children */

                item.children.forEach(child => {

                    const childCard =
                        document.createElement("div");

                    childCard.className =
                        "company-card";

                    childCard.textContent =
                        child;

                    childCard.draggable = true;


                    childCard.addEventListener(
                        "dragstart",
                        function () {

                            draggedData = {
                                source: "sidebar",
                                company: child
                            };

                        }
                    );


                    childrenContainer.appendChild(
                        childCard
                    );

                });


                group.appendChild(header);

                group.appendChild(
                    childrenContainer
                );

                container.appendChild(group);

            });

        }


        /* =========================================================
           CREATE PLANNER
           ========================================================= */

        function createPlanner() {

            const grid =
                document.getElementById(
                    "plannerGrid"
                );

            grid.innerHTML = "";


            /* Time header */

            const emptyHeader =
                document.createElement("div");

            emptyHeader.className =
                "grid-header";

            emptyHeader.textContent =
                "Time";

            grid.appendChild(emptyHeader);


            /* Days */

            days.forEach(day => {

                const header =
                    document.createElement("div");

                header.className =
                    "grid-header";

                header.textContent =
                    day;

                grid.appendChild(header);

            });


            /* Time rows */

            times.forEach(time => {

                const timeCell =
                    document.createElement("div");

                timeCell.className =
                    "time-cell";

                timeCell.textContent =
                    time;

                grid.appendChild(timeCell);


                days.forEach(day => {

                    const zone =
                        document.createElement("div");

                    zone.className =
                        "drop-zone";

                    zone.dataset.day =
                        day;

                    zone.dataset.time =
                        time;


                    zone.addEventListener(
                        "dragover",
                        function (event) {

                            event.preventDefault();

                            zone.classList.add(
                                "drag-over"
                            );

                        }
                    );


                    zone.addEventListener(
                        "dragleave",
                        function () {

                            zone.classList.remove(
                                "drag-over"
                            );

                        }
                    );


                    zone.addEventListener(
                        "drop",
                        function (event) {

                            event.preventDefault();

                            zone.classList.remove(
                                "drag-over"
                            );

                            handleDrop(
                                day,
                                time
                            );

                        }
                    );


                    grid.appendChild(zone);

                });

            });


            renderSchedule();

        }


        /* =========================================================
           HANDLE DROP
           ========================================================= */

        function handleDrop(day, time) {

            const key =
                createKey(
                    day,
                    time
                );


            /* MOVE EXISTING */

            if (draggedExisting) {

                const oldKey =
                    draggedExisting.key;

                const oldIndex =
                    draggedExisting.index;


                if (!schedule[oldKey]) {

                    draggedExisting = null;

                    return;
                }


                const company =
                    schedule[oldKey][oldIndex];


                if (company === undefined) {

                    draggedExisting = null;

                    return;
                }


                schedule[oldKey].splice(
                    oldIndex,
                    1
                );


                if (
                    schedule[oldKey].length === 0
                ) {

                    delete schedule[oldKey];

                }


                if (!schedule[key]) {

                    schedule[key] = [];

                }


                schedule[key].push(
                    company
                );


                draggedExisting = null;


                markAsChanged();

                renderSchedule();

                return;
            }


            /* NOTHING DRAGGED */

            if (!draggedData) {
                return;
            }


            /* GROUP */

            if (
                draggedData.source ===
                "group"
            ) {

                if (!schedule[key]) {

                    schedule[key] = [];

                }


                draggedData.companies.forEach(
                    company => {

                        schedule[key].push(
                            company
                        );

                    }
                );


                draggedData = null;


                markAsChanged();

                renderSchedule();

                return;
            }


            /* SINGLE COMPANY */

            if (
                draggedData.source ===
                "sidebar"
            ) {

                if (!schedule[key]) {

                    schedule[key] = [];

                }


                schedule[key].push(
                    draggedData.company
                );


                draggedData = null;


                markAsChanged();

                renderSchedule();

                return;
            }


            draggedData = null;

        }


        /* =========================================================
           CREATE KEY
           ========================================================= */

        function createKey(day, time) {

            return day + "_" + time;

        }


        /* =========================================================
           RENDER SCHEDULE
           ========================================================= */

        function renderSchedule() {

            document
                .querySelectorAll(".drop-zone")
                .forEach(zone => {

                    zone.innerHTML = "";


                    const day =
                        zone.dataset.day;

                    const time =
                        zone.dataset.time;


                    const key =
                        createKey(
                            day,
                            time
                        );


                    if (!schedule[key]) {
                        return;
                    }


                    schedule[key].forEach(
                        (company, index) => {

                            const item =
                                document.createElement(
                                    "div"
                                );

                            item.className =
                                "placed-company";

                            item.draggable = true;


                            const name =
                                document.createElement(
                                    "span"
                                );

                            name.textContent =
                                company;


                            const remove =
                                document.createElement(
                                    "button"
                                );

                            remove.className =
                                "remove-btn";

                            remove.textContent =
                                "×";

                            remove.title =
                                "Remove";


                            remove.addEventListener(
                                "mousedown",
                                function (event) {

                                    event.stopPropagation();

                                }
                            );


                            remove.addEventListener(
                                "click",
                                function (event) {

                                    event.stopPropagation();

                                    removeCompany(
                                        key,
                                        index
                                    );

                                }
                            );


                            item.appendChild(name);

                            item.appendChild(remove);


                            item.addEventListener(
                                "dragstart",
                                function () {

                                    draggedExisting = {
                                        key: key,
                                        index: index
                                    };

                                    draggedData = null;

                                }
                            );


                            item.addEventListener(
                                "dragend",
                                function () {

                                    draggedExisting = null;

                                }
                            );


                            zone.appendChild(item);

                        }
                    );

                });

        }


        /* =========================================================
           REMOVE COMPANY
           ========================================================= */

        function removeCompany(
            key,
            index
        ) {

            if (!schedule[key]) {
                return;
            }


            schedule[key].splice(
                index,
                1
            );


            if (
                schedule[key].length === 0
            ) {

                delete schedule[key];

            }


            markAsChanged();

            renderSchedule();

        }


        /* =========================================================
           MARK AS CHANGED
           ========================================================= */

        function markAsChanged() {

            hasUnsavedChanges = true;

            updateButtons();

        }


        /* =========================================================
           UPDATE BUTTONS
           ========================================================= */

        function updateButtons() {

            const saveButton =
                document.getElementById(
                    "saveButton"
                );

            const discardButton =
                document.getElementById(
                    "discardButton"
                );

            const indicator =
                document.getElementById(
                    "unsavedIndicator"
                );


            saveButton.disabled =
                !hasUnsavedChanges;


            discardButton.disabled =
                !hasUnsavedChanges;


            if (hasUnsavedChanges) {

                indicator.classList.add(
                    "show"
                );

            }
            else {

                indicator.classList.remove(
                    "show"
                );

            }

        }


        /* =========================================================
           LOAD FROM SUPABASE
           ========================================================= */

        async function loadSchedule() {

            try {

                const {
                    data,
                    error
                } = await supabaseClient
                    .from("weekly_schedule")
                    .select(
                        "id, day, time, company"
                    )
                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    );


                if (error) {

                    console.error(
                        "Supabase load error:",
                        error
                    );

                    showStatus(
                        "Could not load the schedule."
                    );

                    return;
                }


                schedule = {};


                data.forEach(row => {

                    const key =
                        createKey(
                            row.day,
                            row.time
                        );


                    if (!schedule[key]) {

                        schedule[key] = [];

                    }


                    schedule[key].push(
                        row.company
                    );

                });


                savedSchedule =
                    cloneSchedule(
                        schedule
                    );


                hasUnsavedChanges = false;


                updateButtons();

                renderSchedule();

            }
            catch (error) {

                console.error(error);

                showStatus(
                    "An error occurred while loading."
                );

            }

        }


        /* =========================================================
           SAVE CHANGES
           ========================================================= */

        async function saveChanges() {

            if (!hasUnsavedChanges) {
                return;
            }


            const saveButton =
                document.getElementById(
                    "saveButton"
                );


            saveButton.disabled = true;

            saveButton.textContent =
                "Saving...";


            try {

                /* Delete old schedule */

                const {
                    error: deleteError
                } =
                    await supabaseClient
                        .from("weekly_schedule")
                        .delete()
                        .gte("id", 0);


                if (deleteError) {

                    console.error(
                        "Delete error:",
                        deleteError
                    );

                    showStatus(
                        "Could not save the schedule."
                    );

                    return;
                }


                /* Create new rows */

                const rows = [];


                Object.keys(schedule)
                    .forEach(key => {

                        const separator =
                            key.lastIndexOf("_");


                        const day =
                            key.substring(
                                0,
                                separator
                            );


                        const time =
                            key.substring(
                                separator + 1
                            );


                        schedule[key]
                            .forEach(company => {

                                rows.push({
                                    day: day,
                                    time: time,
                                    company: company
                                });

                            });

                    });


                /* Insert new schedule */

                if (rows.length > 0) {

                    const {
                        error: insertError
                    } =
                        await supabaseClient
                            .from(
                                "weekly_schedule"
                            )
                            .insert(rows);


                    if (insertError) {

                        console.error(
                            "Insert error:",
                            insertError
                        );

                        showStatus(
                            "Could not save the schedule."
                        );

                        return;
                    }

                }


                /* Save successful */

                savedSchedule =
                    cloneSchedule(
                        schedule
                    );


                hasUnsavedChanges = false;


                updateButtons();

                showStatus(
                    "Changes saved successfully."
                );

            }
            catch (error) {

                console.error(error);

                showStatus(
                    "An error occurred while saving."
                );

            }
            finally {

                saveButton.textContent =
                    "Save Changes";

                updateButtons();

            }

        }


        /* =========================================================
           DISCARD CHANGES
           ========================================================= */

        function discardChanges() {

            if (!hasUnsavedChanges) {
                return;
            }


            const confirmed =
                confirm(
                    "Discard all unsaved changes?"
                );


            if (!confirmed) {
                return;
            }


            schedule =
                cloneSchedule(
                    savedSchedule
                );


            hasUnsavedChanges = false;


            renderSchedule();

            updateButtons();


            showStatus(
                "Unsaved changes discarded."
            );

        }


        /* =========================================================
           RESET
           ========================================================= */

        function resetPlanner() {

            const confirmed =
                confirm(
                    "Reset the weekly planner?\n\nThis will only create an unsaved change. Your saved schedule will not be deleted until you press Save Changes."
                );


            if (!confirmed) {
                return;
            }


            schedule = {};


            markAsChanged();

            renderSchedule();


            showStatus(
                "Planner reset. Press Save Changes to apply."
            );

        }


        /* =========================================================
           CLONE SCHEDULE
           ========================================================= */

        function cloneSchedule(source) {

            const copy = {};


            Object.keys(source)
                .forEach(key => {

                    copy[key] =
                        [...source[key]];

                });


            return copy;

        }


        /* =========================================================
           STATUS MESSAGE
           ========================================================= */

        function showStatus(message) {

            const element =
                document.getElementById(
                    "statusMessage"
                );


            element.textContent =
                message;


            element.classList.add(
                "show"
            );


            setTimeout(
                function () {

                    element.classList.remove(
                        "show"
                    );

                },
                2500
            );

        }


        /* =========================================================
           WARN BEFORE LEAVING
           ========================================================= */

        window.addEventListener(
            "beforeunload",
            function (event) {

                if (!hasUnsavedChanges) {
                    return;
                }


                event.preventDefault();

                event.returnValue = "";

            }
        );

    </script>

</body>
</html>
