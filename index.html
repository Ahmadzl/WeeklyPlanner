<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Work Planner</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .reset-btn {
            border: none;
            background: #dc3545;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .reset-btn:hover {
            background: #bb2d3b;
        }

        .main {
            display: flex;
            gap: 15px;
            padding: 15px;
            height: calc(100vh - 70px);
        }

        /* Sidebar */

        .sidebar {
            width: 220px;
            min-width: 220px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            height: calc(100vh - 100px);

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .sidebar-info {
            font-size: 12px;
            color: #777;
            margin-bottom: 10px;
        }

        .company-list {
            display: flex;
            flex-direction: column;
            gap: 8px;

            overflow-y: auto;
            flex: 1;
            min-height: 0;

            padding-right: 5px;
        }

        .company-list::-webkit-scrollbar {
            width: 6px;
        }

        .company-list::-webkit-scrollbar-thumb {
            background: #bbb;
            border-radius: 10px;
        }

        .company-card {
            background: #f2f2f2;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 9px;
            cursor: grab;
            font-size: 13px;
            user-select: none;
        }

        .company-card:hover {
            background: #e8e8e8;
        }

        .company-card:active {
            cursor: grabbing;
        }

        /* Groups */

        .company-group {
            background: #f2f2f2;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .company-group-header {
            padding: 9px;
            cursor: grab;
            font-size: 13px;
            font-weight: bold;
            user-select: none;
        }

        .company-group-header:hover {
            background: #e8e8e8;
        }

        .company-group-children {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-left: 15px;
            margin-top: 5px;
            margin-bottom: 7px;
            margin-right: 5px;
        }

        .company-group-children .company-card {
            border-left: 4px solid #9b9ff2;
        }

        /* Planner */

        .planner {
            flex: 1;
            min-width: 0;
            overflow: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: 80px repeat(5, minmax(180px, 1fr));
            min-width: 980px;
        }

        .grid-header {
            background: #4a44f2;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            border-right: 1px solid rgba(255,255,255,0.3);
        }

        .time-header {
            background: #4a44f2;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        .time-cell {
            background: #fafafa;
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #666;
            min-height: 80px;
        }

        .drop-zone {
            min-height: 80px;
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 5px;

            display: flex;
            flex-direction: column;
            gap: 5px;

            background: white;
            transition: background 0.15s;
        }

        .drop-zone.drag-over {
            background: #eef0ff;
        }

        .placed-company {
            background: #a0d1ff;
            border-radius: 5px;
            padding: 7px 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            cursor: grab;
            user-select: none;
        }

        .placed-company:active {
            cursor: grabbing;
        }

        .placed-company span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remove-btn {
            border: none;
            background: transparent;
            color: #b00020;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
        }

        .remove-btn:hover {
            color: #ff0000;
        }

        .saving {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: #333;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
            z-index: 1000;
        }

        .saving.show {
            display: block;
        }

        /* Mobile */

        @media (max-width: 800px) {
            .main {
                flex-direction: column;
                height: auto;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 250px;
            }

            .planner {
                width: 100%;
            }

            .header h1 {
                font-size: 19px;
            }

            .reset-btn {
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Weekly Work Planner</h1>

        <button class="reset-btn" onclick="resetPlanner()">
            Reset
        </button>
    </div>

    <div class="main">

        <aside class="sidebar">

            <h2>Companies</h2>

            <div class="sidebar-info">
                Drag a company or a group to a day and time.
            </div>

            <div id="companyList" class="company-list"></div>

        </aside>

        <main class="planner">
            <div id="plannerGrid" class="grid"></div>
        </main>

    </div>

    <div id="savingIndicator" class="saving">
        Saving...
    </div>

    <script>

        /* =========================================================
           SUPABASE CONFIGURATION
           ========================================================= */

        const SUPABASE_URL =
            "https://jklrgyghnsfwtalmlkwq.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_n_oBUjO2BF8e3x8P_cRdHg_WaszR6w1";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        /* =========================================================
           COMPANIES
           ========================================================= */

        const companies = [

            {
                name: "Danmark",
                children: [
                    "XL MØBLER ApS",
                    "Fårup Furniture (Møbelkompagniet)",
                    "BOBO ApS",
                    "BFT",
                    "Stenløse Havemøbelcenter",
                    "Salesstyling Aps",
                    "Other"
                ]
            },

            {
                name: "Furniture1 Hungary",
                children: [
                    "Croatia",
                    "Romania",
                    "Bulgarien",
                    "Hungary",
                    "Slovenia"
                ]
            },

            {
                name: "Furniture1 Lithuania",
                children: [
                    "EStonia",
                    "Lithuania",
                    "Latvia"
                ]
            },

            {
                name: "Furniture1 Germany",
                children: [
                    "United Kingdom",
                    "Ireland",
                    "Netherlands"
                ]
            },

            "AKL TRADE OÜ",
            "PK Invest ApS",
            "SELSEY Sp. z o.o.",
            "Company D",
            "Sohome b.v.",
            "CONDI SERVICES",
            "Otto Group",
            "Furniture1 LithuaniaS",
            "Furniture1 Germany",
            "Furniture1 Hungary",
            "Skeidar Holding AS",
            "Skeidar Holding AS",
            "Skeidar Holding AS",
            "Skeidar Holding AS",
            "Skeidar Holding AS",
            "Ellos NO"
        ];


        /* =========================================================
           DAYS AND TIMES
           ========================================================= */

        const days = [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday"
        ];

        const times = [
            "07:00",
            "08:00",
            "09:00",
            "10:00",
            "11:00",
            "12:00",
            "13:00",
            "14:00",
            "15:00",
            "16:00"
        ];


        /* =========================================================
           SCHEDULE
           ========================================================= */

        let schedule = {};

        let draggedData = null;

        let draggedExisting = null;

        let saveQueue = Promise.resolve();


        /* =========================================================
           INITIALIZATION
           ========================================================= */

        document.addEventListener("DOMContentLoaded", async function () {

            createCompanyList();

            createPlanner();

            await loadSchedule();

        });


        /* =========================================================
           COMPANY LIST
           ========================================================= */

        function createCompanyList() {

            const container = document.getElementById("companyList");

            container.innerHTML = "";

            companies.forEach((item, index) => {

                if (typeof item === "string") {

                    const card = document.createElement("div");

                    card.className = "company-card";

                    card.textContent = item;

                    card.draggable = true;

                    card.addEventListener("dragstart", function (event) {

                        draggedData = {
                            source: "sidebar",
                            company: item
                        };

                    });

                    container.appendChild(card);

                    return;
                }


                /* Group */

                const group = document.createElement("div");

                group.className = "company-group";


                const header = document.createElement("div");

                header.className = "company-group-header";

                header.textContent = "▶ " + item.name;

                header.draggable = true;


                const childrenContainer =
                    document.createElement("div");

                childrenContainer.className =
                    "company-group-children";

                childrenContainer.style.display = "none";


                /* Group drag */

                header.addEventListener(
                    "dragstart",
                    function (event) {

                        draggedData = {
                            source: "group",
                            companies: item.children
                        };

                    }
                );


                /* Group open / close */

                header.addEventListener(
                    "click",
                    function () {

                        const isHidden =
                            childrenContainer.style.display === "none";

                        childrenContainer.style.display =
                            isHidden ? "flex" : "none";

                        header.textContent =
                            (isHidden ? "▼ " : "▶ ") + item.name;

                    }
                );


                /* Children */

                item.children.forEach(child => {

                    const childCard =
                        document.createElement("div");

                    childCard.className = "company-card";

                    childCard.textContent = child;

                    childCard.draggable = true;


                    childCard.addEventListener(
                        "dragstart",
                        function (event) {

                            draggedData = {
                                source: "sidebar",
                                company: child
                            };

                        }
                    );


                    childrenContainer.appendChild(childCard);

                });


                group.appendChild(header);

                group.appendChild(childrenContainer);

                container.appendChild(group);

            });

        }


        /* =========================================================
           PLANNER
           ========================================================= */

        function createPlanner() {

            const grid =
                document.getElementById("plannerGrid");

            grid.innerHTML = "";


            /* Empty top-left cell */

            const emptyHeader =
                document.createElement("div");

            emptyHeader.className = "grid-header";

            emptyHeader.textContent = "Time";

            grid.appendChild(emptyHeader);


            /* Day headers */

            days.forEach(day => {

                const header =
                    document.createElement("div");

                header.className = "grid-header";

                header.textContent = day;

                grid.appendChild(header);

            });


            /* Time rows */

            times.forEach(time => {

                const timeCell =
                    document.createElement("div");

                timeCell.className = "time-cell";

                timeCell.textContent = time;

                grid.appendChild(timeCell);


                days.forEach(day => {

                    const zone =
                        document.createElement("div");

                    zone.className = "drop-zone";

                    zone.dataset.day = day;

                    zone.dataset.time = time;


                    zone.addEventListener(
                        "dragover",
                        function (event) {

                            event.preventDefault();

                            zone.classList.add("drag-over");

                        }
                    );


                    zone.addEventListener(
                        "dragleave",
                        function () {

                            zone.classList.remove(
                                "drag-over"
                            );

                        }
                    );


                    zone.addEventListener(
                        "drop",
                        async function (event) {

                            event.preventDefault();

                            zone.classList.remove(
                                "drag-over"
                            );

                            await handleDrop(
                                day,
                                time
                            );

                        }
                    );


                    grid.appendChild(zone);

                });

            });


            renderSchedule();

        }


        /* =========================================================
           HANDLE DROP
           ========================================================= */

        async function handleDrop(day, time) {

            const key =
                createKey(day, time);


            /* Move existing company */

            if (draggedExisting) {

                const oldKey =
                    draggedExisting.key;

                const oldIndex =
                    draggedExisting.index;


                if (!schedule[oldKey]) {
                    draggedExisting = null;
                    return;
                }


                const company =
                    schedule[oldKey][oldIndex];


                if (company === undefined) {
                    draggedExisting = null;
                    return;
                }


                /* Remove from old position */

                schedule[oldKey].splice(
                    oldIndex,
                    1
                );


                if (schedule[oldKey].length === 0) {
                    delete schedule[oldKey];
                }


                /* Add to new position */

                if (!schedule[key]) {
                    schedule[key] = [];
                }

                schedule[key].push(company);


                draggedExisting = null;

                renderSchedule();

                await saveSchedule();

                return;
            }


            /* Nothing dragged */

            if (!draggedData) {
                return;
            }


            /* Group */

            if (draggedData.source === "group") {

                if (!schedule[key]) {
                    schedule[key] = [];
                }


                draggedData.companies.forEach(
                    groupCompany => {

                        schedule[key].push(
                            groupCompany
                        );

                    }
                );


                draggedData = null;

                renderSchedule();

                await saveSchedule();

                return;
            }


            /* Single company */

            if (draggedData.source === "sidebar") {

                if (!schedule[key]) {
                    schedule[key] = [];
                }


                schedule[key].push(
                    draggedData.company
                );


                draggedData = null;

                renderSchedule();

                await saveSchedule();

                return;
            }


            draggedData = null;

        }


        /* =========================================================
           CREATE KEY
           ========================================================= */

        function createKey(day, time) {

            return day + "_" + time;

        }


        /* =========================================================
           RENDER SCHEDULE
           ========================================================= */

        function renderSchedule() {

            document
                .querySelectorAll(".drop-zone")
                .forEach(zone => {

                    zone.innerHTML = "";

                    const day =
                        zone.dataset.day;

                    const time =
                        zone.dataset.time;

                    const key =
                        createKey(day, time);


                    if (!schedule[key]) {
                        return;
                    }


                    schedule[key].forEach(
                        (company, index) => {

                            const item =
                                document.createElement("div");

                            item.className =
                                "placed-company";

                            item.draggable = true;


                            const name =
                                document.createElement("span");

                            name.textContent =
                                company;


                            const remove =
                                document.createElement("button");

                            remove.className =
                                "remove-btn";

                            remove.textContent = "×";

                            remove.title =
                                "Remove";


                            /* Prevent remove click from becoming drag */

                            remove.addEventListener(
                                "mousedown",
                                function (event) {

                                    event.stopPropagation();

                                }
                            );


                            remove.addEventListener(
                                "click",
                                async function (event) {

                                    event.stopPropagation();

                                    await removeCompany(
                                        key,
                                        index
                                    );

                                }
                            );


                            item.appendChild(name);

                            item.appendChild(remove);


                            /* Drag existing item */

                            item.addEventListener(
                                "dragstart",
                                function (event) {

                                    draggedExisting = {
                                        key: key,
                                        index: index
                                    };

                                    draggedData = null;

                                }
                            );


                            item.addEventListener(
                                "dragend",
                                function () {

                                    draggedExisting = null;

                                }
                            );


                            zone.appendChild(item);

                        }
                    );

                });

        }


        /* =========================================================
           REMOVE COMPANY
           ========================================================= */

        async function removeCompany(
            key,
            index
        ) {

            if (!schedule[key]) {
                return;
            }


            schedule[key].splice(
                index,
                1
            );


            if (schedule[key].length === 0) {
                delete schedule[key];
            }


            renderSchedule();

            await saveSchedule();

        }


        /* =========================================================
           LOAD FROM SUPABASE
           ========================================================= */

        async function loadSchedule() {

            try {

                const {
                    data,
                    error
                } = await supabaseClient
                    .from("weekly_schedule")
                    .select("id, day, time, company")
                    .order("id", {
                        ascending: true
                    });


                if (error) {

                    console.error(
                        "Supabase load error:",
                        error
                    );

                    alert(
                        "Could not load the schedule from Supabase."
                    );

                    return;
                }


                schedule = {};


                data.forEach(row => {

                    const key =
                        createKey(
                            row.day,
                            row.time
                        );


                    if (!schedule[key]) {
                        schedule[key] = [];
                    }


                    schedule[key].push(
                        row.company
                    );

                });


                renderSchedule();

            }
            catch (error) {

                console.error(error);

                alert(
                    "An error occurred while loading the schedule."
                );

            }

        }


        /* =========================================================
           SAVE TO SUPABASE
           ========================================================= */

        function saveSchedule() {

            saveQueue =
                saveQueue.then(
                    async function () {

                        const indicator =
                            document.getElementById(
                                "savingIndicator"
                            );

                        indicator.classList.add(
                            "show"
                        );


                        try {

                            /*
                             Delete the current schedule.
                             We then insert the complete current
                             schedule again.
                            */

                            const {
                                error: deleteError
                            } = await supabaseClient
                                .from("weekly_schedule")
                                .delete()
                                .gte("id", 0);


                            if (deleteError) {

                                console.error(
                                    "Delete error:",
                                    deleteError
                                );

                                alert(
                                    "Could not save the schedule."
                                );

                                return;
                            }


                            const rows = [];


                            Object.keys(schedule)
                                .forEach(key => {

                                    const separatorIndex =
                                        key.lastIndexOf("_");


                                    const day =
                                        key.substring(
                                            0,
                                            separatorIndex
                                        );


                                    const time =
                                        key.substring(
                                            separatorIndex + 1
                                        );


                                    schedule[key]
                                        .forEach(company => {

                                            rows.push({
                                                day: day,
                                                time: time,
                                                company: company
                                            });

                                        });

                                });


                            /* Nothing to insert */

                            if (rows.length === 0) {
                                return;
                            }


                            const {
                                error: insertError
                            } = await supabaseClient
                                .from("weekly_schedule")
                                .insert(rows);


                            if (insertError) {

                                console.error(
                                    "Insert error:",
                                    insertError
                                );

                                alert(
                                    "Could not save the schedule."
                                );

                                return;
                            }

                        }
                        finally {

                            indicator.classList.remove(
                                "show"
                            );

                        }

                    }
                );


            return saveQueue;

        }


        /* =========================================================
           RESET
           ========================================================= */

        async function resetPlanner() {

            const confirmed =
                confirm(
                    "Are you sure you want to remove the entire weekly schedule?"
                );


            if (!confirmed) {
                return;
            }


            schedule = {};

            renderSchedule();

            await saveSchedule();

        }

    </script>

</body>
</html>
